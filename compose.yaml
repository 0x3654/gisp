name: registry
services:
  postgres_registry:
    image: docker.io/pgvector/pgvector:pg16
    container_name: gisp_pg
    shm_size: ${PG_SHM_SIZE:-2g}
    env_file: .env
    command: >
      postgres
      -c shared_preload_libraries=pg_prewarm
      -c pg_prewarm.autoprewarm=on
      -c pg_prewarm.autoprewarm_interval=${PG_AUTOPREWARM_INTERVAL:-120}
      -c pg_prewarm.autoprewarm_startup=on
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - ./services/postgres/data:/var/lib/postgresql/data
      - ./services/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U postgres -h 127.0.0.1
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    networks:
       - internal
  api:
    build:
      context: .
      dockerfile: src/api/Dockerfile
    image: gisp-api:local
    container_name: gisp_api
    # watchtower отключён для api — иначе он перетирает локальный билд upstream-образом
    labels:
      - com.centurylinklabs.watchtower.enable=false
    env_file: .env
    environment:
      - TZ=${TZ:-Europe/Moscow}
      - API_PORT=${API_PORT:-8000}
    ports:
      - '${API_PORT:-8000}:8000'
    depends_on:
      postgres_registry:
        condition: service_healthy
    healthcheck:
      test:
        - CMD-SHELL
        - python
        - -c
        - |
          import urllib.request, sys, os
          try:
              port = os.getenv('API_PORT', '8000')
              urllib.request.urlopen(f"http://127.0.0.1:{port}/docs", timeout=5)
          except Exception:
              sys.exit(1)
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s
    restart: unless-stopped
    networks:
        - internal
  import:
    image: docker.io/0x3654/gisp-import:latest
    container_name: gisp_import
    labels:
      - com.centurylinklabs.watchtower.enable=true
    profiles:
      - tasks
    env_file: .env
    environment:
      - TZ=${TZ:-Europe/Moscow}
      - POSTGRES_HOST=postgres_registry
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
    volumes:
      - ./logs:/var/log/registry
      # Code is in image (moved to /src/import/)
      - ./files:/files:ro  # Read-only - import только читает, downloader пишет
    depends_on:
      postgres_registry:
        condition: service_healthy
      semantic:
        condition: service_healthy
    restart: "no"  # Run-once like downloader
    networks:
      - internal
  openwebui:
    image: ghcr.io/open-webui/open-webui
    container_name: gisp_openwebui
    ports:
      - '${OPENWEBUI_PORT:-3333}:8080'
    volumes:
      - ./services/openwebui/data:/app/backend/data
    healthcheck:
      test:
        - CMD-SHELL
        - python
        - -c
        - |
          import urllib.request, sys
          url = "http://127.0.0.1:8080/health"
          try:
              urllib.request.urlopen(url, timeout=5)
          except Exception:
              sys.exit(1)
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 90s
    restart: unless-stopped
    networks:
      - internal
      - external
  # Прокси перед openwebui для совместимости со старой 1С-обработкой:
  # инжектирует chat_id/id в /api/chat/completions, иначе новая версия openwebui
  # падает в middleware ('NoneType' has no attribute 'startswith').
  owui-proxy:
    build:
      context: src/owui_proxy
      dockerfile: Dockerfile
    image: gisp-owui-proxy:local
    container_name: gisp_owui_proxy
    labels:
      - com.centurylinklabs.watchtower.enable=false
    environment:
      - UPSTREAM=http://openwebui:8080
      - PROXY_TIMEOUT=${PROXY_TIMEOUT:-300}
      - PROXY_LOG_BODY=${PROXY_LOG_BODY:-1}
    ports:
      - '${OWUI_PROXY_PORT:-3334}:8080'
    depends_on:
      openwebui:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - internal
      - external
  downloader:
    image: docker.io/0x3654/gisp-downloader:latest
    container_name: gisp_downloader
    labels:
      - com.centurylinklabs.watchtower.enable=true
    profiles:
      - tasks
    env_file: .env
    environment:
      - TZ=${TZ:-Europe/Moscow}
      - FILES_DIR=/files
      - MAX_CSV_FILES=${MAX_CSV_FILES:-7}
      # Download method: direct (для проды в РФ) или ssh-tunnel (для разработки вне РФ)
      - DOWNLOAD_METHOD=${DOWNLOAD_METHOD:-direct}
      # SSH tunnel settings (только для DOWNLOAD_METHOD=ssh-tunnel)
      - SSH_HOST=${DOWNLOADER_SSH_HOST:-}
      - SSH_PORT=${DOWNLOADER_SSH_PORT:-22}
      - SSH_USER=${DOWNLOADER_SSH_USER:-}
      - SSH_KEY_B64=${DOWNLOADER_SSH_KEY_B64:-}
    volumes:
      - ./files:/files
    # external network (не internal: true) — downloader нужен интернет, БД не нужна
    networks:
      - external
    restart: "no"
  openwebui-sync:
    image: docker.io/0x3654/gisp-openwebui-sync:latest
    container_name: gisp_openwebui-sync
    labels:
      - com.centurylinklabs.watchtower.enable=true
    profiles: ["tools"]
    volumes:
      # Only data volume needed - code is in image
      - ./services/openwebui/data:/data
    working_dir: /app
    entrypoint:
      - python
      - /app/reestr_sync.py
      - --db
      - /data/webui.db
      - --function-id
      - reestr
    depends_on:
      - openwebui
    restart: "no"
  # Semantic service (sentence embeddings)
  # По умолчанию использует gisp-semantic-onnx (оптимально для обеих архитектур)
  # Для переключения на PyTorch замените image: на docker.io/0x3654/gisp-semantic-pytorch:latest
  # Бенчмарки Python 3.12 + pymorphy3:
  # - AMD64 ONNX: ~1.03GB, 27-32ms (рекомендуется)
  # - AMD64 PyTorch: ~1.93GB, 28-35ms
  # - ARM64 ONNX: ~1.69GB, 37-44ms (рекомендуется)
  # - ARM64 PyTorch: ~2.46GB, 104-186ms
  semantic:
    image: docker.io/0x3654/gisp-semantic-onnx:latest
    container_name: gisp_semantic
    labels:
      - com.centurylinklabs.watchtower.enable=true
    env_file: .env
    environment:
      - PYTHONPATH=/app
      - TZ=${TZ:-Europe/Moscow}
      - SEMANTIC_PORT=${SEMANTIC_PORT:-8010}
    volumes:
      - ./services/semantic/synonyms.json:/app/synonyms.json:ro
    command:
      - python
      - -m
      - uvicorn
      - semantic_service:app
      - --host
      - 0.0.0.0
      - --port
      - "${SEMANTIC_PORT:-8010}"
      - --workers
      - "${SEMANTIC_WORKERS:-2}"
    healthcheck:
      test:
        - CMD-SHELL
        - python
        - -c
        - |
          import socket, sys, os
          try:
              port = int(os.getenv('SEMANTIC_PORT', '8010'))
              s = socket.socket()
              s.connect(("127.0.0.1", port))
              s.close()
          except Exception:
              sys.exit(1)
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    depends_on:
      postgres_registry:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - internal
  # Cross-encoder reranker (BAAI/bge-reranker-v2-m3, 568M params, ONNX).
  # Запуск:
  #   docker compose --profile rerank build reranker   # ~10-20 мин на скачку+экспорт ONNX
  #   docker compose --profile rerank up -d reranker
  reranker:
    build:
      context: .
      dockerfile: src/reranker/Dockerfile.onnx
    image: gisp-reranker:local
    container_name: gisp_reranker
    profiles:
      - rerank
    env_file: .env
    environment:
      - TZ=${TZ:-Europe/Moscow}
      - RERANKER_PORT=${RERANKER_PORT:-8020}
      - RERANKER_BACKEND=${RERANKER_BACKEND:-onnx-fp32}
      - RERANKER_MAX_LEN=${RERANKER_MAX_LEN:-512}
      - RERANKER_MAX_PAIRS=${RERANKER_MAX_PAIRS:-50}
      - RERANKER_CACHE_TTL_SECONDS=${RERANKER_CACHE_TTL_SECONDS:-86400}
    command:
      - uvicorn
      - reranker_service:app
      - --host
      - 0.0.0.0
      - --port
      - "${RERANKER_PORT:-8020}"
      - --workers
      - "${RERANKER_WORKERS:-1}"
    healthcheck:
      test:
        - CMD-SHELL
        - python
        - -c
        - |
          import socket, sys, os
          try:
              s = socket.socket()
              s.connect(("127.0.0.1", int(os.getenv("RERANKER_PORT", "8020"))))
              s.close()
          except Exception:
              sys.exit(1)
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 120s
    depends_on:
      postgres_registry:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - internal
  # Reasoning agent (LLM + tool use, SSE-streaming).
  # Запуск:
  #   docker compose --profile matcher build matcher
  #   docker compose --profile matcher up -d matcher
  matcher:
    build:
      context: .
      dockerfile: src/matcher/Dockerfile
    image: gisp-matcher:local
    container_name: gisp_matcher
    profiles:
      - matcher
    env_file: .env
    environment:
      - TZ=${TZ:-Europe/Moscow}
      - MATCHER_PORT=${MATCHER_PORT:-8030}
      - REGISTRY_API_BASE=http://api:8000
      - POSTGRES_HOST=postgres_registry
      - REASONER_PROVIDER=${REASONER_PROVIDER:-local}
      - REASONER_MODEL=${REASONER_MODEL:-qwen3-32b}
      - REASONER_API_BASE=${REASONER_API_BASE:-}
      - REASONER_API_KEY=${REASONER_API_KEY:-}
      - REASONER_TIMEOUT=${REASONER_TIMEOUT:-60}
      - REASONER_MAX_ITERATIONS=${REASONER_MAX_ITERATIONS:-5}
      - REASONER_MAX_TOOL_CALLS=${REASONER_MAX_TOOL_CALLS:-10}
      - REASONER_CONFIDENCE_THRESHOLD=${REASONER_CONFIDENCE_THRESHOLD:-0.7}
      - REASONER_TOKEN_BUDGET=${REASONER_TOKEN_BUDGET:-32000}
      - REASONER_ESCALATION_MODEL=${REASONER_ESCALATION_MODEL:-claude-sonnet-4-6}
      - REASONER_ESCALATION_API_KEY=${REASONER_ESCALATION_API_KEY:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - ANTHROPIC_BASE_URL=${ANTHROPIC_BASE_URL:-}
    healthcheck:
      test:
        - CMD-SHELL
        - python
        - -c
        - |
          import socket, sys, os
          try:
              s = socket.socket()
              s.connect(("127.0.0.1", int(os.getenv("MATCHER_PORT", "8030"))))
              s.close()
          except Exception:
              sys.exit(1)
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    depends_on:
      postgres_registry:
        condition: service_healthy
      api:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - internal
      - external
  embeddings-worker:
    image: docker.io/0x3654/gisp-semantic-onnx:latest
    #container_name: gisp_embeddings-worker
    labels:
      - com.centurylinklabs.watchtower.enable=true
    profiles:
      - embeddings
    env_file: .env
    working_dir: /app
    depends_on:
      - postgres_registry
      - semantic
    networks:
      - internal
    restart: "no"
    environment:
      FORCE: ${FORCE:-0}
      DRY_RUN: ${DRY_RUN:-0}
      SOURCE_FILES: ${SOURCE_FILES:-}
      EMBED_IDS: ${EMBED_IDS:-}
      LIMIT: ${LIMIT:-}
      SHARD_INDEX: "0"
      SHARD_COUNT: "1"
      BATCH_SIZE: "200"
    command: ["python3", "/app/update_embeddings.py"]
    healthcheck:
      disable: true
    deploy:
      restart_policy:
        condition: none
  # Раннер миграций для существующих БД (hybrid-поиск и далее).
  # Запуск:
  #   docker compose --profile migrations build migrations
  #   docker compose --profile migrations run --rm migrations
  # Поведение управляется env: MIGRATION_FILES, BATCH_SIZE, ONLY_MISSING, SKIP_BACKFILL, SKIP_INDEXES.
  migrations:
    build:
      context: .
      dockerfile: src/migrations/Dockerfile
    image: gisp-migrations:local
    profiles:
      - migrations
    env_file: .env
    environment:
      - TZ=${TZ:-Europe/Moscow}
      - POSTGRES_HOST=postgres_registry
      - MIGRATION_FILES=${MIGRATION_FILES:-051_hybrid_backfill.sql}
      - BATCH_SIZE=${MIGRATION_BATCH_SIZE:-10000}
      - ONLY_MISSING=${MIGRATION_ONLY_MISSING:-1}
      - SKIP_BACKFILL=${MIGRATION_SKIP_BACKFILL:-0}
      - SKIP_INDEXES=${MIGRATION_SKIP_INDEXES:-0}
    volumes:
      - ./services/migrations:/migrations:ro
    depends_on:
      postgres_registry:
        condition: service_healthy
    networks:
      - internal
    restart: "no"
  # Golden-snapshot тесты для search-эндпоинтов.
  # Запуск:
  #   docker compose --profile tests run --rm api-tests --mode capture   # зафиксировать baseline
  #   docker compose --profile tests run --rm api-tests --mode verify    # проверить отсутствие регрессий
  # Сервис use stdlib only (urllib), внешние зависимости не нужны.
  api-tests:
    image: docker.io/0x3654/gisp-api:latest
    profiles:
      - tests
    env_file: .env
    environment:
      - TZ=${TZ:-Europe/Moscow}
      - API_BASE=http://api:8000
      - PYTHONDONTWRITEBYTECODE=1
    working_dir: /tests
    volumes:
      - ./tests:/tests
    entrypoint:
      - python
      - /tests/golden/run.py
    depends_on:
      api:
        condition: service_healthy
    networks:
      - internal
    restart: "no"
  starter-dump:
    image: docker.io/0x3654/gisp-starter:latest
    container_name: gisp_starter_dump
    labels:
      - com.centurylinklabs.watchtower.enable=true
    profiles:
      - starter
    env_file: .env
    environment:
      - SNAPSHOT_PATH=/app/registry_start_snapshot.sql.gz
      - STARTER_MAX_WAIT=180
      - FORCE=${STARTER_FORCE:-0}
      - POSTGRES_HOST=postgres_registry
      - POSTGRES_PORT=5432
      - POSTGRES_DB=registry
      - POSTGRES_USER=registry
    depends_on:
      - postgres_registry
    restart: "no"
    networks:
      - internal
networks:
  internal:
    internal: true
    name: registry-internal
    driver: bridge
  external:
    name: registry-external
    driver: bridge
